<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyestone TV Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">SKYESTONE</div>
        <div id="displayName" class="display-name">Community Display</div>
      </div>
      <div class="clock-wrap">
        <div id="clock" class="clock">--:--</div>
        <div id="date" class="date">---</div>
      </div>
    </header>

    <main id="slides"></main>

    <footer>
      <span>Skyestone Community</span>
      <span id="lastUpdated"></span>
    </footer>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
